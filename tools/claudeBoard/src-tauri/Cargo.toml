[package]
name = "claude_board"
version = "0.1.0"
edition = "2021"
default-run = "claude_board"

[lib]
name = "claude_board"
path = "src/lib.rs"

[[bin]]
name = "claude_board"
path = "src/main.rs"

[[bin]]
name = "claude_boardd"
path = "src/bin/claude_boardd.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["macos-private-api"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "net"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
objc = "0.2"
