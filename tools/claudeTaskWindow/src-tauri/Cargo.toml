[package]
name = "claude_task_window"
version = "0.1.0"
edition = "2021"

[lib]
name = "claude_task_window"
path = "src/lib.rs"

[[bin]]
name = "claude_task_windowd"
path = "src/bin/claude_task_windowd.rs"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "net"] }
tower = "0.5"
